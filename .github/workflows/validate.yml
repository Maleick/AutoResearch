name: Validate Auto Research

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --no-deprecation

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Security audit
        run: npm run audit

      - name: Check version consistency
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = fs.readFileSync('VERSION', 'utf8').trim();
          const constants = fs.readFileSync('src/constants.ts', 'utf8');
          const plugin = JSON.parse(fs.readFileSync('.opencode-plugin/plugin.json', 'utf8'));
          const readme = fs.readFileSync('README.md', 'utf8');

          const mismatches = [];
          if (pkg.version !== version) mismatches.push(\`package.json (\${pkg.version}) vs VERSION (\${version})\`);
          if (!constants.includes('VERSION = \"' + version + '\"')) mismatches.push('src/constants.ts');
          if (plugin.version !== version) mismatches.push('.opencode-plugin/plugin.json');
          if (!readme.includes('v' + version)) mismatches.push('README.md version banner');

          if (mismatches.length > 0) {
            console.error('Version mismatch:', mismatches.join(', '));
            process.exit(1);
          }
          console.log('Version aligned:', version);
          "

      - name: Verify package contents
        run: npm run verify:pack

      - name: Validate package allowlist
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const allowedFiles = new Set(pkg.files || []);
          const requiredFiles = ['dist', 'hooks', 'commands', 'skills', 'plugins/autoresearch.ts', 'docs/ARCHITECTURE.md', '.opencode-plugin', 'AGENTS.md', 'VERSION', 'README.md', 'CHANGELOG.md', 'LICENSE'];
          const missing = requiredFiles.filter(f => !allowedFiles.has(f));
          if (missing.length > 0) {
            console.error('Missing required files in package.json files array:', missing.join(', '));
            process.exit(1);
          }
          console.log('Package allowlist validated');
          "

      - name: Validate schema and command registration
        run: |
          node -e "
          const fs = require('fs');
          const plugin = JSON.parse(fs.readFileSync('.opencode-plugin/plugin.json', 'utf8'));
          
          // Validate plugin manifest schema
          if (!plugin.name || !plugin.version || !plugin.description) {
            console.error('Plugin manifest missing required fields');
            process.exit(1);
          }
          
          // Validate command files exist
          const commandsDir = 'commands';
          if (fs.existsSync(commandsDir)) {
            const commands = fs.readdirSync(commandsDir).filter(f => f.endsWith('.md'));
            if (commands.length === 0) {
              console.error('No command files found in commands/');
              process.exit(1);
            }
            console.log('Commands registered:', commands.join(', '));
          }
          
          // Validate skills directory
          const skillsDir = 'skills/autoresearch';
          if (!fs.existsSync(skillsDir)) {
            console.error('Skills directory not found');
            process.exit(1);
          }
          
          console.log('Schema and command registration validated');
          "

      - name: Safety gate - check for secrets
        run: |
          set +e
          grep -rqiE "[\"']?(api[_-]?key|apikey|password|secret|token)[\"']?[[:space:]]*[:=][[:space:]]*[\"'][^\"']{8,}" --include="*.ts" --include="*.js" --include="*.json" src/ commands/ skills/
          grep_status=$?
          set -e

          if [ "$grep_status" -eq 0 ]; then
            echo "::error::Potential hard-coded secret found in scanned source files"
            exit 1
          fi

          if [ "$grep_status" -ne 1 ]; then
            echo "::error::Secret scan failed (grep exit code $grep_status)"
            exit 1
          fi

          echo "Secret scan complete"

      - name: Run tests
        run: npm test

      - name: Check for absolute local paths in docs
        run: |
          ! grep -r "/Users/\|/home/" README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md wiki docs .opencode-plugin

      - name: Check for stale public positioning
        run: |
          ! grep -r "Claude Code only\|Claude-only" README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md wiki docs .opencode-plugin
