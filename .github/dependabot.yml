version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    reviewers:
      - "Maleick"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      semantic-release:
        patterns:
          - "@semantic-release/*"
          - "semantic-release"
      jest:
        patterns:
          - "jest"
          - "@types/jest"
          - "ts-jest"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
